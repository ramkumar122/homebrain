# Hooks run the same tool versions as CI, from uv.lock, via `uv run`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]

  - repo: local
    hooks:
      - id: scan-history
        name: scan full history for secrets, account ids, emails
        entry: bash scripts/scan-history.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: forbid-tfstate
        name: forbid terraform state files
        entry: "Terraform state must never be committed"
        language: fail
        files: '(\.tfstate(\..*)?|\.tfplan)$'
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q -x
        language: system
        types_or: [python, pyi]
        pass_filenames: false
