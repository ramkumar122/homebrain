[project]
name = "homebrain"
version = "0.1.0"
description = "A self-hosted MCP server that gives an Alexa+ household a durable brain for home repairs, warranties and service cases."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "RamKumar" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.103",
    "fastapi>=0.141.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.15.0",
    "python-ulid>=4.0.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
homebrain = "homebrain.http.main:run"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,cognito-idp,dynamodb,s3,scheduler,secretsmanager,sesv2,textract]>=1.43.103",
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
seed = [
    "reportlab>=5.0.1",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "S",             # bandit (security)
    "ANN",           # annotations everywhere
    "PT",            # pytest style
    "DTZ",           # no naive datetimes
    "T20",           # no print
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homebrain"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["homebrain"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]
